@if (!isCallback) {
  <div class="login-page">
    <canvas #networkCanvas class="network-bg"></canvas>
    
    <div class="content">
      <!-- Logo Pill -->
      <div class="logo-pill">
        <span class="logo-dot"></span>
        <span class="logo-text">RepoLens</span>
      </div>
      
      <!-- Tagline -->
      <p class="tagline">Understand your codebase at the speed of thought.</p>
      
      <!-- Login Card -->
      <div class="login-card">
        <p class="card-text">Sign in to sync your repositories.</p>
        <button (click)="auth.loginWithGithub()" class="github-btn">
          <!-- Lucide: github -->
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
            <path d="M9 18c-4.51 2-5-2-7-2"/>
          </svg>
          Continue with GitHub
        </button>
      </div>
      
      <!-- Platform Capabilities -->
      <div class="capabilities">
        <h3>Platform Capabilities</h3>
        <div class="capability-list">
          
          <div class="capability-item">
            <div class="capability-icon">
              <!-- Lucide: git-branch -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="6" y1="3" x2="6" y2="15"/>
                <circle cx="18" cy="6" r="3"/>
                <circle cx="6" cy="18" r="3"/>
                <path d="M18 9a9 9 0 0 1-9 9"/>
              </svg>
            </div>
            <span class="capability-text">AST-aware ingestion</span>
          </div>
          
          <div class="capability-item">
            <div class="capability-icon">
              <!-- Lucide: search -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.3-4.3"/>
              </svg>
            </div>
            <span class="capability-text">Hybrid search</span>
            <span class="capability-meta">Vector + FTS</span>
          </div>
          
          <div class="capability-item">
            <div class="capability-icon">
              <!-- Lucide: refresh-cw -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                <path d="M21 3v5h-5"/>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                <path d="M8 16H3v5"/>
              </svg>
            </div>
            <span class="capability-text">Real-time collaboration</span>
          </div>
          
        </div>
      </div>
    </div>
  </div>
}

@if (isCallback) {
  <div class="callback-container">
    <div class="spinner"></div>
    <p>Signing you in…</p>
  </div>
}
