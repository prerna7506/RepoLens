<header class="top-nav">
  <div class="search-bar">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" placeholder="Ask anything about your code..." class="search-input" />
  </div>

  <div class="actions">
    @if (activeUsers.length > 0) {
      <div class="presence-chips" [title]="activeUsers.length + ' active'">
        @for (user of activeUsers.slice(0, 2); track user.userId) {
          <span class="avatar-chip" [style.background]="user.color || 'linear-gradient(135deg, #facc15, #22d3ee)'">
            {{ user.username.slice(0,2).toUpperCase() }}
          </span>
        }
      </div>
    }

    <button class="icon-btn" title="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>

    <button class="icon-btn user-btn" title="Account">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </div>
</header>
