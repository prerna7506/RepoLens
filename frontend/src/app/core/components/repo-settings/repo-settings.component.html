<div class="settings-panel">
  <div class="settings-header">⚙️ Repo Settings</div>

  <div class="settings-body">
    <div class="repo-info">
      <span class="label">Repository</span>
      <span class="value">{{ repoUrl }}</span>
    </div>

    @if (message) {
      <div class="message">{{ message }}</div>
    }

    <div class="actions">
      <button
        (click)="reindex()"
        [disabled]="isReindexing || isDeleting"
        class="btn btn-secondary">
        @if (isReindexing) { ⏳ Re-indexing... } @else { 🔄 Re-index }
      </button>

      <button
        (click)="delete()"
        [disabled]="isReindexing || isDeleting"
        class="btn btn-danger">
        @if (isDeleting) { ⏳ Deleting... } @else { 🗑️ Delete Repo }
      </button>
    </div>
  </div>
</div>
